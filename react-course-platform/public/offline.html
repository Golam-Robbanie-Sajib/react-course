<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — Self-Learn Hub</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #f8fafc; color: #0f172a; padding: 24px; box-sizing: border-box;
      }
      @media (prefers-color-scheme: dark) { body { background: #020617; color: #e2e8f0; } }
      main { max-width: 420px; text-align: center; }
      img { width: 72px; height: 72px; border-radius: 16px; }
      h1 { font-size: 1.4rem; margin: 16px 0 8px; }
      p { color: #64748b; line-height: 1.5; }
      button {
        margin-top: 16px; padding: 10px 18px; border-radius: 8px; border: 0;
        background: #2563eb; color: #fff; font-size: 1rem; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>
        This page hasn't been saved for offline use yet. Lessons you've already opened are
        available offline — go back to one, or reconnect and try again.
      </p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
